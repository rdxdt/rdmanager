<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ errorcode }} {{ title }} - RD Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="app-brand fs-3"><i class="bi bi-display text-accent"></i> RD <span>Manager</span></div>
    </div>
    <div class="card shadow">
      <div class="card-body p-4 text-center">
        {% if errorcode >= 500 %}
        <i class="bi bi-x-octagon-fill text-danger display-1"></i>
        {% else %}
        <i class="bi bi-exclamation-triangle-fill text-warning display-1"></i>
        {% endif %}
        <h1 class="h3 mt-3 mb-3">{{ errorcode }} {{ title }}</h1>
        <p class="text-secondary mb-4">{{ errormessage }}</p>
        <a href="{{ url_for('main.home') }}" class="btn btn-primary w-100"><i class="bi bi-house"></i> Back to home</a>
      </div>
    </div>
  </div>
</body>
</html>
